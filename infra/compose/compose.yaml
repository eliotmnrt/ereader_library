# Production stack: the app exposed on the Internet through Tailscale Funnel (HTTPS).
# Usage, from this folder:
#   cp .env.example .env   # then fill TS_AUTHKEY
#   docker compose pull && docker compose up -d
# Public URL: https://<TS_HOSTNAME>.<your-tailnet>.ts.net

services:
  app:
    image: ${IMAGE:-ghcr.io/eliotmnrt/ereader_library}:${TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 3000
    # No "ports:" on purpose: the app is only reachable through Tailscale, on the internal network

  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    hostname: ${TS_HOSTNAME:-ereader}
    depends_on:
      app:
        condition: service_healthy   # uses the HEALTHCHECK from the Dockerfile
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY in .env}
      TS_HOSTNAME: ${TS_HOSTNAME:-ereader}
      TS_STATE_DIR: /var/lib/tailscale   # node identity: the auth key is only used on first start
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"               # no kernel TUN device or extra privileges needed
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro

volumes:
  tailscale_state:
